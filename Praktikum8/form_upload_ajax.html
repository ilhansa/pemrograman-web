<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="upload.css">
    <title>Unggah File Dokumen</title>
</head>
<body>
    <div class="upload-form-container">
        <h2>Unggah File Dokumen</h2>
        <form id="upload-form" action="upload.php" method="post" enctype="multipart/form-data">
            <div class="file-input-container">
                <input type="file" name="files[]" id="file" class="file-input" multiple="multiple">
                <label for="file" class="file-label">Pilih File</label>
            </div>
            <ul id="file-names" style="list-style:none; padding:0; margin-top:10px;"></ul>
            <button type="submit" name="submit" class="upload-button" id="upload-button" disabled>Unggah</button>
            <div id="status" class="upload-status"></div>
        </form>
    </div>

<h3 style="text-align:center;">Daftar File yang Sudah Diupload</h3>
<div id="file-list" style="text-align:center;"></div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="upload.js"></script>
</body>
</html>
